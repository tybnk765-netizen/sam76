><!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مشروعي</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: blueviolet;
            text-shadow: 2px 2px black;
        }

        .product {
            border: 4px rgb(69, 158, 66) solid;
            margin: 20px;
            padding: 20px;
            box-shadow: 5px 5px 30px rgb(1, 1, 1);
            background: white;
        }

        .orders {
            border: 2px black solid;
            margin: 20px;
            padding: 20px;
            background: white;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 60%;
        }

        table, th, td {
            border: 2px solid black;
            padding: 10px;
        }

        .price {
            color: black;
        }

        .description {
            color: rgb(58, 33, 223);
        }
    </style>
</head>

<body>

<h1>📱 مشروع صفحة ويب</h1>

<!-- جدول -->
<div class="orders">
    <h2>📊 جدول المنتجات</h2>
    <table>
        <tr>
            <th>المنتج</th>
            <th>السعر</th>
            <th>الكمية</th>
        </tr>
        <tr>
            <td>دجاج</td>
            <td class="price">20 ريال</td>
            <td>1 كيلو</td>
        </tr>
    </table>
</div>

<!-- منتج -->
<div class="product">
    <h2>🍗 المنتج</h2>
    <p class="description">هذا منتج صحي غني بالبروتين</p>
</div>

<!-- صورة -->
<div class="product">
    <h2>🖼️ صورة</h2>
    <img src="https://via.placeholder.com/300" width="300">
</div>

<!-- فيديو -->
<div class="product">
    <h2>🎥 فيديو</h2>
    <video width="300" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
</div>

<!-- صوت -->
<div class="product">
    <h2>🔊 صوت</h2>
    <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
    </audio>
</div>

</body>
</html>
>
